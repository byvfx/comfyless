# Publishes to the Comfy Registry (so ComfyUI-Manager can install it) when the version in
# pyproject.toml changes. Lives in the byvfx/comfyless mirror; inert in byvfx/comfy-serverless.
# Needs the repository secret REGISTRY_ACCESS_TOKEN (an API key from registry.comfy.org).
# Every publish needs a new version: the Registry never replaces a published one.
name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'byvfx/comfyless'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Registry key
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the REGISTRY_ACCESS_TOKEN repository secret (an API key from registry.comfy.org) to publish."
            exit 1
          fi
      # What Comfy-Org/publish-node-action does, with comfy-cli pinned: the action installs the
      # latest comfy-cli, whose options change (1.25.0 dropped the --yes the action passes).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comfy-cli
        run: pip install "comfy-cli==1.25.0"
      - name: Validate and publish
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt tracking disable
          comfy --skip-prompt node validate
          comfy --skip-prompt node publish --token "$TOKEN"
