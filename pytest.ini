[pytest]
testpaths = tests
# The repository root is the ComfyUI node (it has __init__.py). Pytest 8+ would
# collect that directory as a package and run __init__.py, which registers HTTP
# routes. confcutdir stops the collection walk at tests/, so the node package is
# imported only through the stub in tests/conftest.py. Run pytest from the repo root.
addopts = -q --confcutdir=tests
